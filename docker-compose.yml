name: rig

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rig-db
    environment:
      POSTGRES_USER: rig
      POSTGRES_PASSWORD: rig
      POSTGRES_DB: rig
      # Collation explícita: sem isso, ordenação de texto em pt-BR varia com a imagem.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - rig_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rig -d rig"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rig-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - rig_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  rig_pgdata:
  rig_redis:
